services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medleads
      POSTGRES_PASSWORD: medleads
      POSTGRES_DB: medleads
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medleads"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
